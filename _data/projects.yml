- name: FORMA
  descr: >
    <strong>1st place at the GDG AI Hack (GDG PoliMi × Luxonis)</strong>, among 160 participants.
    A sensor-free squat coach: YOLOv8-pose runs on-device on a Luxonis OAK-4D depth camera to get
    3D skeletons at 24 fps and measure hip depth in real-world centimetres. A random-forest classifier
    grades each rep (good, shallow, forward lean) and streams the verdict to an ESP32 display over MQTT.
  tags:
    - tag: Python
    - tag: DepthAI
    - tag: YOLOv8-pose
    - tag: scikit-learn
    - tag: OpenCV
    - tag: MQTT

- name: Voice-to-Calendar Assistant
  descr: >
    A Telegram bot that transcribes voice notes with a self-hosted Whisper container, extracts events
    through an LLM and replies with ready-to-add Google Calendar links. Runs on my own VPS and resolves
    models at runtime so it survives upstream model deprecations.
  tags:
    - tag: Whisper
    - tag: LLM APIs
    - tag: n8n
    - tag: Docker
    - tag: PostgreSQL
    - tag: Caddy

- name: CapyMOA
  descr: >
    Ported a bagging regressor to CapyMOA, a library for machine learning on data streams.
    Started as a course project, now being prepared as an upstream contribution.
  website: https://capymoa.org/
  tags:
    - tag: Python
    - tag: Stream ML
    - tag: Open source

