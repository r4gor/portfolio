- name: Pythagoras
  descr: >
    <strong>1st place at Reply Student Clash 2026</strong>, with team Pre Cooked.
    An AI oral assessment tool for project-based courses: a team has a ~10-minute spoken conversation
    about its own deliverable, the interview climbs Bloom's levels on three topics, and the professor
    gets a report with verbatim quotes to start the oral exam from. It never assigns the grade.
    I worked on the interview rules, the local voice pipeline (Whisper and Kokoro), the report and its
    quote checks, and the backend and tests, and I presented the project to all participants.
  website: https://github.com/r4gor/StudentClash-PreCooked
  tags:
    - tag: Python
    - tag: FastAPI
    - tag: LLM APIs
    - tag: Whisper
    - tag: Kokoro TTS
    - tag: SQLite

- name: FORMA
  descr: >
    <strong>1st place at the GDG AI Hack (GDG PoliMi × Luxonis)</strong>, among 160 participants.
    A sensor-free squat coach: YOLOv8-pose runs on-device on a Luxonis OAK-4D depth camera to get
    3D skeletons at 24 fps and measure hip depth in real-world centimetres. A random-forest classifier
    grades each rep (good, shallow, forward lean) and streams the verdict to an ESP32 display over MQTT.
  tags:
    - tag: Python
    - tag: DepthAI
    - tag: YOLOv8-pose
    - tag: scikit-learn
    - tag: OpenCV
    - tag: MQTT

- name: Voice-to-Calendar Assistant
  descr: >
    A Telegram bot that transcribes voice notes with a self-hosted Whisper container, extracts events
    through an LLM and replies with ready-to-add Google Calendar links. Runs on my own VPS and resolves
    models at runtime so it survives upstream model deprecations.
  tags:
    - tag: Whisper
    - tag: LLM APIs
    - tag: n8n
    - tag: Docker
    - tag: PostgreSQL
    - tag: Caddy

- name: CapyMOA
  descr: >
    Contributed an online bagging regressor to CapyMOA, a library for machine learning on data streams.
    It started as a course project and was merged upstream in November 2026.
  website: https://github.com/adaptive-machine-learning/CapyMOA/pull/479
  tags:
    - tag: Python
    - tag: Stream ML
    - tag: Open source

- name: AN2DL Deep Learning Challenges
  descr: >
    Two team challenges for the Artificial Neural Networks and Deep Learning course. Pain-level detection
    from kinematic time series with a 1D-CNN, LSTM and self-attention model tuned with Optuna (weighted F1 0.92),
    and breast-cancer subtyping from low-resolution slide images using pathology foundation models (UNI)
    with CatBoost on the embeddings.
  website: https://github.com/r4gor/ANN2DL-Polimi
  tags:
    - tag: PyTorch
    - tag: Keras
    - tag: Optuna
    - tag: CatBoost

- name: DivAid
  descr: >
    An expense-splitting mobile app with group wallets, built in a team of three for the Design and
    Implementation of Mobile Applications course, on a brief set by Bending Spoons. I worked on Stripe
    top-ups, an idempotent wallet history, withdrawals through Cloud Functions, and group invites
    with in-app notifications.
  tags:
    - tag: Flutter
    - tag: Firebase
    - tag: Cloud Functions
    - tag: Stripe

- name: StickTheLanding
  descr: >
    A 12-hour hackathon by Project Europe and SkyEU (Milan, 2026): an autonomous drone that lands on
    a moving boat using only a downward camera and an ArUco marker on the deck. I wrote the Kalman
    filters that estimate the boat's position and motion from the marker detections.
  tags:
    - tag: Python
    - tag: Kalman filters
    - tag: OpenCV
    - tag: Robotics

- name: Vinci
  descr: >
    A work-in-progress RAG assistant for PoliMi students with GDG PoliMi. I'm designing the data
    pipeline: scraping the university's public sites, pairing Italian and English pages, and
    scheduled re-crawls.
  tags:
    - tag: Python
    - tag: Web scraping
    - tag: RAG

- name: IoT Challenges
  descr: >
    Four challenges for the Internet of Things course, mostly with a teammate: an energy and battery-life model
    for an ESP32 node, CoAP and MQTT analysis of real captures, a Node-RED pipeline for ZigBee traffic with
    ThingSpeak, and sizing for LoRaWAN, IEEE 802.15.4, BLE and RFID networks.
  website: https://github.com/r4gor/IoT-Polimi
  tags:
    - tag: ESP32
    - tag: MQTT
    - tag: CoAP
    - tag: Node-RED
    - tag: LoRaWAN

